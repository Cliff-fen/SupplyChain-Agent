name: browser-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    environment: acceptance
    env:
      # Configure an isolated acceptance deployment, never a customer environment.
      # Its demo organizations, ingested documents and completed PDF must exist.
      PLAYWRIGHT_BASE_URL: ${{ secrets.ACCEPTANCE_BASE_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicit acceptance deployment
        run: test -n "$PLAYWRIGHT_BASE_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Browser artifacts can contain reports, tokens and business content.
      # Keep them on the deployment owner's private machine, not public CI artifacts.
