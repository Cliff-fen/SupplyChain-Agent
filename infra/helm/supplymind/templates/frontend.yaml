apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-frontend }
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector: { matchLabels: { app: {{ .Release.Name }}-frontend } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-frontend } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: temporary
          emptyDir: {}
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports: [{ containerPort: 5173 }]
          envFrom: [{ configMapRef: { name: {{ .Release.Name }}-config } }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /, port: 5173 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 5173 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-frontend }
spec:
  selector: { app: {{ .Release.Name }}-frontend }
  ports: [{ port: {{ .Values.frontend.service.port }}, targetPort: 5173 }]
