apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-api }
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector: { matchLabels: { app: {{ .Release.Name }}-api } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-api } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: temporary
          emptyDir: {}
        - name: working-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" .Release.Name) }}
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
            - { name: working-data, mountPath: /data }
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-api }
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports: [{ port: {{ .Values.api.service.port }}, targetPort: 8000 }]
