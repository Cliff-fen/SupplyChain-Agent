model_list:
  - model_name: planner
    litellm_params:
      model: openai/os.environ/SUPPLYMIND_UPSTREAM_CHAT_MODEL
      api_base: os.environ/SUPPLYMIND_UPSTREAM_CHAT_BASE_URL
      api_key: os.environ/SUPPLYMIND_UPSTREAM_CHAT_API_KEY
  - model_name: answer
    litellm_params:
      model: openai/os.environ/SUPPLYMIND_UPSTREAM_CHAT_MODEL
      api_base: os.environ/SUPPLYMIND_UPSTREAM_CHAT_BASE_URL
      api_key: os.environ/SUPPLYMIND_UPSTREAM_CHAT_API_KEY
  - model_name: router
    litellm_params:
      model: openai/os.environ/SUPPLYMIND_UPSTREAM_CHAT_MODEL
      api_base: os.environ/SUPPLYMIND_UPSTREAM_CHAT_BASE_URL
      api_key: os.environ/SUPPLYMIND_UPSTREAM_CHAT_API_KEY
  - model_name: embedding
    litellm_params:
      model: openai/os.environ/SUPPLYMIND_UPSTREAM_EMBEDDING_MODEL
      api_base: os.environ/SUPPLYMIND_UPSTREAM_CHAT_BASE_URL
      api_key: os.environ/SUPPLYMIND_UPSTREAM_CHAT_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  timeout: 45
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  set_verbose: false
  redact_user_api_key_info: true
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false
